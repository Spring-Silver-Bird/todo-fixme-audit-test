name: TODO/FIXME audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: todo-fixme-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      MODEL: opencode/deepseek-v4.1-flash-free
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run TODO/FIXME audit
        shell: bash
        env:
          AUDIT_REPORT_DIR: ${{ runner.temp }}/todo-fixme-audit
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_REPORT_DIR"
          PROMPT=$(cat <<'PROMPT_EOF'
          Ты — аудитор технического долга в GitHub-репозитории.

          КОНТЕКСТ
          - Репозиторий: $GITHUB_REPOSITORY
          - Коммит: $GITHUB_SHA
          - Дата (UTC): получи командой `date -u +%Y-%m-%dT%H:%M:%SZ`
          - Каталог отчёта: __REPORT_DIR__ (создан; это единственное место, куда можно писать)
          - Текущая ветка: получи командой `git rev-parse --abbrev-ref HEAD`

          ЗАДАЧА
          Найди все заметки TODO/FIXME в коде и документации и подготовь отчёт.

          КРИТЕРИИ НАХОДКИ
          1. Маркер — только `TODO` или `FIXME` в верхнем регистре, отдельным словом.
          2. Маркер должен быть частью комментария (строчного или блочного) либо заметки в документации.
          3. Не считать:
             - идентификаторы, имена классов, полей и констант (`StatusType.TODO`, `TODO = "todo"`);
             - строковые литералы и тестовые данные, если это не комментарий;
             - упоминания в сгенерированных, вендорных, минифицированных и бинарных файлах;
             - lock-файлы.
          4. Исключить пути: `.git/`, `.venv/`, `node_modules/`, `dist/`, `build/`, `coverage/`,
             `htmlcov/`, `__pycache__/`, `.pytest_cache/`, `.ruff_cache/`, `staticfiles/`,
             `generated/`, `contract_gen/`, `contract/sdk/`, `contract/tsp-output/`,
             `*.lock`, `package-lock.json`, `*.min.js`, `*.map`, изображения, архивы, бинарники.
          5. Одна находка = один маркер в конкретной строке. Дубликаты по `path:line:marker` схлопывать.
          6. Для каждой находки укажи: `path`, `line`, `marker`, `text` (текст после маркера),
             `context` (1–2 строки), `area` (по каталогу/модулю), `priority`:
             - P1 — FIXME/TODO про безопасность, потерю данных, падение или блокировку релиза;
             - P2 — обычный функциональный или технический долг;
             - P3 — документация, косметика, необязательные улучшения.

          ПОРЯДОК РАБОТЫ
          1. Получи список tracked-файлов: `git ls-files`.
          2. Прочитай подходящие текстовые файлы и найди маркеры по критериям.
          3. Сформируй находки и посчитай статистику.
          4. Сначала запиши отчёт в `__REPORT_DIR__/report.md` и `__REPORT_DIR__/report.json`.
          5. Затем найди существующие задачи и обнови/создай tracking issue с проверкой идемпотентности.
          6. После работы с issue допиши его URL и решение в `report.json` и `report.md`.
          7. Добавь краткое summary в `$GITHUB_STEP_SUMMARY`.
          8. В конце выполни `git status --porcelain` и убедись, что репозиторий не изменён.

          ПОИСК СУЩЕСТВУЮЩИХ ЗАДАЧ И ИДЕМПОТЕНТНОСТЬ
          1. Вычисли отпечаток набора находок из `__REPORT_DIR__/report.json`:
             - возьми все элементы `findings`, для каждого сформируй строку
               `<path>:<line>:<marker>`;
             - отсортируй строки, соедини через перевод строки, посчитай SHA-256;
             - первые 16 hex-символов — это `FINGERPRINT`.
             Пример или эквивалентный код на Python:
             `python3 -c 'import hashlib,json,os;d=json.load(open(os.path.join(os.environ["AUDIT_REPORT_DIR"],"report.json")));items=sorted(f"{x[\"path\"]}:{x[\"line\"]}:{x[\"marker\"]}" for x in d["findings"]);print(hashlib.sha256("\n".join(items).encode()).hexdigest()[:16])'`
             Сохрани значение в `__REPORT_DIR__/fingerprint.txt`.
          2. Найди tracking issue:
             `gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'todo-audit in:title' --json number,title,state,url,updatedAt --limit 20`
          3. Если есть открытый issue с `todo-audit` в заголовке, получи его тело:
             `gh issue view <number> --repo "$GITHUB_REPOSITORY" --json body --jq .body`
             и проверь наличие маркера `<!-- todo-audit-fingerprint: <FINGERPRINT> -->`.
             - Если маркер совпадает: это повтор без новых сведений. НЕ вызывай
               `gh issue edit` и НЕ добавляй комментарий. Запиши в отчёт решение
               `пропущено (отпечаток совпадает, новых сведений нет)`.
             - Если маркера нет или он другой: обнови тело отчётом, добавив в конец
               строку `<!-- todo-audit-fingerprint: <FINGERPRINT> -->`. Комментарий
               добавляй ТОЛЬКО если изменился набор находок (появились/исчезли
               `path:line:marker`) или статус. Если изменились только commit или дата,
               комментарий не добавляй; запиши решение `обновлено тело без комментария`.
          4. Если открытого issue нет, а находок больше нуля — создай РОВНО ОДИН issue:
             `gh issue create --repo "$GITHUB_REPOSITORY" --title "[todo-audit] TODO/FIXME: <N> находок" --body-file __REPORT_DIR__/report.md`
             и добавь в тело маркер `<!-- todo-audit-fingerprint: <FINGERPRINT> -->`.
          5. Если находок ноль — новый issue не создавай. Если открытый tracking issue
             существует, обнови его только если в теле ещё нет пометки
             «Находок не обнаружено» с тем же отпечатком; иначе не меняй.
          6. В отчёт добавь раздел «Существующие задачи», строку
             `Отпечаток находок: <FINGERPRINT>` и решение по issue:
             `создано` / `обновлено` / `пропущено (нет новых сведений)`.

          РЕЗУЛЬТАТ
          1. `__REPORT_DIR__/report.md` — отчёт на русском:
             - заголовок, дата, commit, ветка;
             - сводка: всего находок, по маркерам, по приоритетам;
             - таблица находок;
             - подробности по каждой находке;
             - раздел «Существующие задачи»;
             - раздел «Исключения и ограничения».
          2. `__REPORT_DIR__/report.json` — машинный отчёт:
             `{"generated_at": "...", "commit": "...", "branch": "...", "scanned_files": N,
               "findings": [...], "existing_issues": [...], "issue_url": "..."}`
          3. Если находок нет, в `report.md` явно напиши «Находок не обнаружено», `0`,
             перечисли исключения и всё равно создай оба файла.
          4. В `$GITHUB_STEP_SUMMARY` добавь 5–10 строк: количество находок, ссылка на issue
             (если есть), commit.

          ОГРАНИЧЕНИЯ
          - Не меняй файлы репозитория. Пиши только в __REPORT_DIR__.
          - Не выполняй `git add`, `git commit`, `git push`, `gh pr create`.
          - Если `gh` недоступен или команда падает — зафиксируй ошибку в отчёте,
            но не завершай работу без отчёта.
          PROMPT_EOF
          )
          PROMPT=${PROMPT//__REPORT_DIR__/$AUDIT_REPORT_DIR}
          opencode run --auto --model "$MODEL" "$PROMPT"

      - name: Verify repository is unchanged
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Agent modified the repository"
            git status --porcelain
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: todo-fixme-report
          path: ${{ runner.temp }}/todo-fixme-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        if: always()
        shell: bash
        env:
          AUDIT_REPORT_DIR: ${{ runner.temp }}/todo-fixme-audit
        run: |
          {
            echo "## TODO/FIXME audit"
            echo
            if [ -f "$AUDIT_REPORT_DIR/report.md" ]; then
              sed -n '1,60p' "$AUDIT_REPORT_DIR/report.md"
            else
              echo "Отчёт не сгенерирован."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
