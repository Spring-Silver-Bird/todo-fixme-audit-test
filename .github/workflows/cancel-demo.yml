name: Cancel demo

on:
  workflow_dispatch:

jobs:
  long-running:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Long step
        run: |
          echo "demo started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 900
          echo "demo finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
